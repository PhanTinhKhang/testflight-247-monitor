name: TestFlight 24/7 Cloud Monitor

on:
  # workflow is completely paused
  # schedule:
  #   - cron: '0 */4 * * *'

concurrency:
  group: testflight-247-cloud-monitor
  cancel-in-progress: true

jobs:
  cloud-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: monitor_state.json
          key: testflight-monitor-state-${{ github.run_id }}
          restore-keys: |
            testflight-monitor-state-

      - name: Run High-Frequency 24/7 Monitor (5s Polling)
        run: |
          python tf_monitor.py --link-id "EgZ8sE2P" --webhook "${{ secrets.DISCORD_WEBHOOK }}" --interval 5 --max-duration 14340 --silent-start
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: monitor_state.json
          key: testflight-monitor-state-${{ github.run_id }}
